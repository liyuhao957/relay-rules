name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tests/run.py --all
      - name: Verify PowerShell entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\validate-rules-template.cmd
      - name: Verify Command Prompt entry point
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\validate-rules-template.cmd
